name: CI

# Source checks only: formatting, lints, unit tests and the end-to-end smoke test.
# Installable packages (and the binary size gate) are handled by release.yml.

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # Compile against musl so that gnu-only code fails here instead of on the device.
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings

      - name: Unit tests (role matrix / bridging strategy / backup / failover / zero-intrusion invariants)
        run: cargo test --workspace --locked --target "$TARGET"

      - name: End-to-end smoke test (fake OpenWrt root)
        run: |
          set -eu
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/etc/config" "$ROOT/sys/class/ieee80211/phy0"
          mkdir -p "$ROOT/sys/class/net/lan1/device" "$ROOT/sys/class/net/wan/device"
          cat > "$ROOT/etc/config/wireless" <<'EOF'
          config wifi-device 'radio0'
          	option type 'mac80211'
          	option channel '36'
          	option band '5g'
          EOF
          printf '{"network":{"lan":{"device":"lan1"},"wan":{"device":"wan"}}}' > "$ROOT/etc/board.json"
          # A pure AP may only write an encrypted wireless config when the key is provisioned:
          # without it the plan is blocked (see `wifisync_core::wifi_key`).
          mkdir -p "$ROOT/etc/wifisync/secrets"
          printf 'ci-test-passphrase' > "$ROOT/etc/wifisync/secrets/default"
          cat > "$ROOT/etc/config/wifisync" <<'EOF'
          config wifisync 'main'
          	option roles_configured '1'
          	option roles 'controller gateway'
          EOF

          cargo build --locked --target "$TARGET" -p wifisync
          BIN="./target/$TARGET/debug/wifisync"

          # Non-AP role: the written plan must be empty (zero-intrusion invariant)
          PLAN=$(WIFISYNC_ROOT="$ROOT" "$BIN" plan)
          echo "$PLAN"
          echo "$PLAN" | grep -q '"empty": true'

          sed -i "s/option roles 'controller gateway'/option roles 'ap'/" "$ROOT/etc/config/wifisync"
          PLAN=$(WIFISYNC_ROOT="$ROOT" "$BIN" plan)
          echo "$PLAN" | grep -q '"name": "br-lan"'
          echo "$PLAN" | grep -q 'ieee80211r'

          WIFISYNC_ROOT="$ROOT" "$BIN" backup create >/dev/null
          WIFISYNC_ROOT="$ROOT" "$BIN" backup verify | grep -q '"ok": true'
