name: OpenWrt packages

# Produce **official-format** installers (25.12 uses .apk, older releases use .ipk).
#
# This path follows the OpenWrt official Rust package workflow exactly:
#   download the official SDK → feeds update/install (to get feeds/packages/lang/rust)
#   → make package/wifisync/compile → bin/packages/<arch>/*.apk
#
# Note: it builds `rust/host` from source inside the SDK (rustc bootstrap),
# a single architecture usually takes 30-90 minutes, so it only runs on manual triggers / schedules.
# Day-to-day commits use cross-build in ci.yml (much faster, equivalent to an official toolchain build).

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Build only the specified architecture (empty = all x86/ARM64)"
        required: false
        default: ""
  schedule:
    # Runs at 03:00 UTC on the 1st of each month to track OpenWrt feed changes
    - cron: "0 3 1 * *"

concurrency:
  group: openwrt-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  WIFISYNC_OPENWRT_RELEASE: "25.12.5"

jobs:
  package:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i386_pentium4
          - i386_pentium-mmx
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter (when an architecture is specified manually)
        id: filter
        run: |
          WANTED="${{ github.event.inputs.arch }}"
          if [ -n "$WANTED" ] && [ "$WANTED" != "${{ matrix.arch }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd file build-essential rsync

      - name: Download the official SDK and add this repository as a feed
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -eu
          TARGET=$(scripts/openwrt-arch.sh ${{ matrix.arch }} target)
          . scripts/sdk-env.sh "$TARGET"
          cd "$WIFISYNC_SDK"

          # This repository is the feed (src-link, no source copy)
          echo "src-link wifisync $GITHUB_WORKSPACE" >> feeds.conf.default
          cp feeds.conf.default feeds.conf
          cat feeds.conf

          # Official feeds (including feeds/packages/lang/rust — rust-package.mk and rust/host)
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build the wifisync package
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -eu
          cd "$WIFISYNC_SDK"
          make package/wifisync/compile V=s -j"$(nproc)"

      - name: Build the LuCI package
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -eu
          cd "$WIFISYNC_SDK"
          make package/luci-app-wifisync/compile V=s -j"$(nproc)" || \
            echo "::warning::LuCI package build failed (usually because feeds/luci is not synced)"

      - name: Collect artifacts
        if: always() && steps.filter.outputs.skip != 'true'
        run: |
          set -eu
          mkdir -p dist/${{ matrix.arch }}
          find "$WIFISYNC_SDK/bin/packages" -name '*.apk' -o -name '*.ipk' \
            | grep -E 'wifisync' \
            | xargs -r -I{} cp -v {} dist/${{ matrix.arch }}/ || true
          ls -l dist/${{ matrix.arch }} || true

      - name: Write build info
        if: always() && steps.filter.outputs.skip != 'true'
        run: |
          cat > dist/${{ matrix.arch }}/package-info.json <<EOF
          {
            "openwrt_arch": "${{ matrix.arch }}",
            "openwrt_target": "$(scripts/openwrt-arch.sh ${{ matrix.arch }} target)",
            "openwrt_release": "${WIFISYNC_OPENWRT_RELEASE}",
            "commit": "${GITHUB_SHA}",
            "package_manager": "apk (OpenWrt 25.12+)"
          }
          EOF

      - uses: actions/upload-artifact@v4
        if: always() && steps.filter.outputs.skip != 'true'
        with:
          name: openwrt-pkg-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14
