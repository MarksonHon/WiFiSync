name: Release

# On tag push (e.g. v0.1.0): cross-compile for all x86 / ARM64 architectures of OpenWrt 25.12,
# and attach the binaries to a GitHub Release (with build info and checksums).

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  WIFISYNC_OPENWRT_RELEASE: "25.12.5"

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i386_pentium4
          - i386_pentium-mmx
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd file

      - name: Cross-compile
        run: |
          set -eu
          TRIPLE=$(scripts/openwrt-arch.sh ${{ matrix.arch }} triple)
          rustup target add "$TRIPLE"
          scripts/build-musl.sh ${{ matrix.arch }}

      - name: Generate checksums
        run: |
          set -eu
          cd "dist/${{ matrix.arch }}"
          sha256sum wifisync > sha256sum.txt
          cat sha256sum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wifisync-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare the release directory
        run: |
          set -eu
          mkdir -p release
          for dir in artifacts/wifisync-*; do
            arch=$(basename "$dir" | sed 's/^wifisync-//')
            cp "$dir/wifisync" "release/wifisync-${arch}"
            cp "$dir/build-info.json" "release/build-info-${arch}.json" 2>/dev/null || true
            cp "$dir/sha256sum.txt" "release/sha256sum-${arch}.txt" 2>/dev/null || true
          done
          # Aggregate checksums (renamed to include the architecture)
          ( cd release && for f in wifisync-*; do
              case "$f" in *.txt|*.json) continue ;; esac
              sha256sum "$f"
            done > SHA256SUMS )
          cat SHA256SUMS
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/wifisync-*
            release/build-info-*.json
            release/SHA256SUMS
          generate_release_notes: true
          body: |
            ## WifiSync ${{ github.ref_name }}

            Supports all x86 / ARM64 package architectures of OpenWrt 25.12 (built with the official SDK toolchain):

            | Package arch | SDK target | Rust target |
            |--------|-----------|-------------|
            | x86_64 | x86/64 | x86_64-unknown-linux-musl |
            | i386_pentium4 | x86/generic | i686-unknown-linux-musl |
            | i386_pentium-mmx | x86/legacy | i586-unknown-linux-musl |
            | aarch64_generic | armsr/armv8 | aarch64-unknown-linux-musl |
            | aarch64_cortex-a53 | mediatek/filogic | aarch64-unknown-linux-musl |
            | aarch64_cortex-a72 | bcm27xx/bcm2711 | aarch64-unknown-linux-musl |
            | aarch64_cortex-a76 | bcm27xx/bcm2712 | aarch64-unknown-linux-musl |

            For .apk installers, use the `OpenWrt packages` workflow (manually triggered);
            or add this repository as a feed in an OpenWrt build tree and run `make package/wifisync/compile`.

            ### Install (place the binary manually)

            ```sh
            # On the router
            opkg remove --force-depends wpad-basic-mbedtls  # optional: switch to the full wpad to get KVR
            opkg install wpad-mbedtls
            cp wifisync-<arch> /usr/bin/wifisync && chmod +x /usr/bin/wifisync
            ```
